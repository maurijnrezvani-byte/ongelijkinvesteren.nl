<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bureau Ongelijk Investeren</title>
<meta name="description" content="Bureau Ongelijk Investeren: onderzoek naar hoe publiek geld over buurten en mensen verdeeld wordt. De website komt eraan.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f3a34'/%3E%3Crect x='7' y='17' width='4' height='8' fill='%23e8b04a'/%3E%3Crect x='14' y='9' width='4' height='16' fill='%23f4efe6'/%3E%3Crect x='21' y='20' width='4' height='5' fill='%23f4efe6'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4efe6;
    --ink: #1f3a34;
    --muted: #5b6b66;
    --accent: #c9892a;
    --bar: #1f3a34;
    --line: #d9d1c3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #142420;
      --ink: #f1ebe0;
      --muted: #a8b3ae;
      --accent: #e8b04a;
      --bar: #f1ebe0;
      --line: #2c3f3a;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 0 16px;
    -webkit-font-smoothing: antialiased;
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 64px 0 48px;
  }
  .bars {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 56px;
    margin-bottom: 40px;
  }
  .bars span {
    width: 10px;
    background: var(--bar);
    border-radius: 1px;
    transform-origin: bottom;
    animation: grow .9s cubic-bezier(.2,.7,.2,1) both;
  }
  .bars span.hi { background: var(--accent); }
  @keyframes grow { from { transform: scaleY(0); } }
  @media (prefers-reduced-motion: reduce) { .bars span { animation: none; } }
  .kicker {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }
  h1 {
    font-weight: 400;
    font-size: clamp(40px, 9vw, 68px);
    line-height: 1.02;
    letter-spacing: -.02em;
    margin-bottom: 28px;
  }
  p.lead {
    font-size: clamp(19px, 3.2vw, 22px);
    line-height: 1.5;
    max-width: 30em;
    margin-bottom: 36px;
  }
  .contact {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 24px;
  }
  .contact a {
    color: var(--ink);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 2px solid var(--accent);
    word-break: break-all;
  }
  .contact a:hover, .contact a:focus-visible { color: var(--accent); }
  footer {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13px;
    color: var(--muted);
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 0 32px;
  }
</style>
</head>
<body>
<main>
  <div class="bars" aria-hidden="true">
    <span style="height:30%;animation-delay:.00s"></span>
    <span style="height:45%;animation-delay:.05s"></span>
    <span style="height:38%;animation-delay:.10s"></span>
    <span class="hi" style="height:100%;animation-delay:.15s"></span>
    <span style="height:22%;animation-delay:.20s"></span>
    <span style="height:52%;animation-delay:.25s"></span>
    <span style="height:16%;animation-delay:.30s"></span>
  </div>
  <p class="kicker">Binnenkort</p>
  <h1>Bureau Ongelijk Investeren</h1>
  <p class="lead">Onderzoek naar hoe publiek geld over buurten en mensen verdeeld wordt. Deze website is nog in de maak.</p>
  <p class="contact">Vragen? Mail naar <a href="mailto:maurijn@ongelijkinvesteren.nl">maurijn@ongelijkinvesteren.nl</a></p>
</main>
<footer>© 2026 Bureau Ongelijk Investeren · Maurijn Rezvani</footer>
</body>
</html>
